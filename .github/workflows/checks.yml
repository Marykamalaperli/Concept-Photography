name: Verify self-hosted workspace

on:
  pull_request:
  push:
    branches:
      - main
      - self-hosted-workspace-migration
      - 'feature/**'
      - 'fix/**'
      - 'security/**'
      - 'performance/**'
      - 'documentation/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npm test
      - if: runner.os == 'Windows'
        name: Run Windows tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $log = Join-Path $env:RUNNER_TEMP 'concept-test.log'
          npm test *> $log
          $testExitCode = $LASTEXITCODE
          Get-Content $log
          if ($testExitCode -ne 0) {
            Add-Content $env:GITHUB_STEP_SUMMARY '### Windows regression test output'
            Add-Content $env:GITHUB_STEP_SUMMARY '```text'
            Get-Content $log -Tail 70 | Add-Content $env:GITHUB_STEP_SUMMARY
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
            $detail = (Select-String -Path $log -Pattern 'Error:|Error \[|CategoryInfo|FullyQualifiedErrorId|cause:|not ok' | Select-Object -Last 8 | ForEach-Object Line) -join "`n"
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::Windows regression exit $testExitCode. $detail"
            exit $testExitCode
          }
      - if: runner.os == 'Linux'
        name: Audit dependencies
        run: npm audit --audit-level=high
      - if: runner.os == 'Windows'
        name: Validate Windows scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errorsFound = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errorsFound) | Out-Null
            if ($errorsFound.Count) { throw "$($_.Name) has a PowerShell syntax error" }
          }
      - run: npm run build:pages
      - if: runner.os == 'Linux'
        name: Audit the public launcher
        run: node scripts/audit-pages.js "$RUNNER_TEMP/lighthouse-reports"
      - if: runner.os == 'Linux' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-launcher
          path: ${{ runner.temp }}/lighthouse-reports/
