name: Deploy Supabase backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/supabase.yml
      - supabase/config.toml
      - supabase/migrations/**
      - supabase/functions/**

permissions:
  contents: read

concurrency:
  group: concept-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Supabase deployment access
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_DB_PASSWORD" ]]; then
            exit 0
          fi
          project_url=$(jq -er .url supabase/project.json)
          site_origin=$(jq -er .siteOrigin supabase/project.json)
          status=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' \
            -H "Origin: $site_origin" "$project_url/functions/v1/concept-api/api/session") || status=000
          echo "Hosted session endpoint returned HTTP $status."
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || echo "::error::Set the SUPABASE_ACCESS_TOKEN repository secret."
          [[ -n "$SUPABASE_DB_PASSWORD" ]] || echo "::error::Set the SUPABASE_DB_PASSWORD repository secret."
          exit 1
      - uses: supabase/setup-cli@v1
        with:
          version: 2.83.0
      - name: Select Supabase project
        id: project
        shell: bash
        run: |
          project_url=$(jq -er .url supabase/project.json)
          [[ $project_url =~ ^https://[a-z0-9]{20}\.supabase\.co$ ]] || { echo "::error::Invalid Supabase project URL."; exit 1; }
          project_ref=${project_url#https://}
          project_ref=${project_ref%.supabase.co}
          site_origin=$(jq -er .siteOrigin supabase/project.json)
          printf 'url=%s\nref=%s\norigin=%s\n' "$project_url" "$project_ref" "$site_origin" >> "$GITHUB_OUTPUT"
      - name: Verify Supabase project authorization
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.project.outputs.ref }}
        run: |
          status=$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF") || status=000
          if [[ $status != 200 ]]; then
            case "$status" in
              401|403|404) message="Supabase rejected project access (HTTP $status). Check SUPABASE_ACCESS_TOKEN and the account’s project permissions." ;;
              *) message="Supabase management API could not verify the project (HTTP $status)." ;;
            esac
            echo "::error::$message"
            printf '%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ steps.project.outputs.ref }}
        shell: bash
        run: |
          log_file=$(mktemp)
          trap 'rm -f "$log_file"' EXIT
          if supabase link --project-ref "$PROJECT_REF" 2>&1 | tee "$log_file"; then
            exit 0
          fi
          if grep -Eqi 'password authentication failed|invalid password|SASL|28P01' "$log_file"; then
            message="Supabase rejected the database password. Check the SUPABASE_DB_PASSWORD repository secret."
          elif grep -Eqi 'paused|inactive|restore' "$log_file"; then
            message="The Supabase project is inactive or restoring. Resume it before deploying."
          else
            message="Supabase project authorization passed, but the CLI could not link the database. See the Link Supabase project step."
          fi
          echo "::error::$message"
          printf '%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes
      - name: Configure Edge Function secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.project.outputs.ref }}
          PROJECT_URL: ${{ steps.project.outputs.url }}
          SITE_ORIGIN: ${{ steps.project.outputs.origin }}
        run: |
          umask 077
          vars_file=$(mktemp)
          trap 'rm -f "$vars_file"' EXIT
          printf 'CONCEPT_SITE_ORIGIN=%s\n' "$SITE_ORIGIN" > "$vars_file"
          printf 'CONCEPT_PROJECT_URL=%s\n' "$PROJECT_URL" >> "$vars_file"
          printf 'CONCEPT_WORKSPACE_URL=%s/%s/\n' "$SITE_ORIGIN" "${GITHUB_REPOSITORY#*/}" >> "$vars_file"
          supabase secrets set --project-ref "$PROJECT_REF" --env-file "$vars_file"
      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.project.outputs.ref }}
        run: supabase functions deploy concept-api --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
      - name: Check hosted sign-in connection
        shell: bash
        env:
          PROJECT_URL: ${{ steps.project.outputs.url }}
          SITE_ORIGIN: ${{ steps.project.outputs.origin }}
        run: |
          session=$(curl --retry 5 --retry-all-errors --fail --silent --show-error --max-time 15 \
            -H "Origin: $SITE_ORIGIN" "$PROJECT_URL/functions/v1/concept-api/api/session")
          jq -e 'keys == ["actor"] and .actor == null' <<<"$session" >/dev/null
          probe=$(mktemp)
          trap 'rm -f "$probe"' EXIT
          body=$(jq -nc --arg email "deployment-probe-$GITHUB_RUN_ID@example.invalid" \
            '{email: $email, password: "invalid-probe-password"}')
          measured=$(curl --silent --show-error --max-time 15 --output "$probe" --write-out '%{http_code} %{time_total}' \
            -H "Origin: $SITE_ORIGIN" -H 'Content-Type: application/json' --data "$body" \
            "$PROJECT_URL/functions/v1/concept-api/api/login")
          read -r status elapsed <<<"$measured"
          if [[ $status != 401 ]] || ! jq -e '.error == "Invalid email or password."' "$probe" >/dev/null; then
            echo "::error::Hosted sign-in did not handle the JSON credential probe (HTTP $status)."
            exit 1
          fi
          printf 'Hosted invalid-credential response took %s seconds.\n' "$elapsed" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Hosted sign-in endpoint::Invalid-credential response took $elapsed seconds."
      - name: Check private calendar feed routing
        shell: bash
        env:
          PROJECT_URL: ${{ steps.project.outputs.url }}
        run: |
          status=$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code} %{content_type}' \
            "$PROJECT_URL/functions/v1/concept-api/calendar/$(printf '%064d' 0).ics")
          if [[ "$status" != '404 text/calendar; charset=utf-8' ]]; then
            echo "::error::The hosted calendar endpoint did not reject an unused link (HTTP ${status%% *})."
            exit 1
          fi
      - name: Enable and verify scheduled mobile push
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.project.outputs.ref }}
          PROJECT_URL: ${{ steps.project.outputs.url }}
        run: |
          query_api="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          query() {
            local payload
            payload=$(jq -nc --arg query "$1" '{query: $query}')
            curl --fail-with-body --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
              --data "$payload" "$query_api"
          }
          started=$(date +%s%3N)
          query "update concept.push_settings set dispatch_url = '$PROJECT_URL/functions/v1/concept-api/api/internal/push-dispatch' where id = 1;" >/dev/null
          query 'select concept.invoke_push_dispatch();' >/dev/null
          for attempt in $(seq 1 12); do
            status=$(query "select exists (select 1 from cron.job where jobname = 'concept-mobile-reminders' and active) and coalesce(last_dispatch_at >= $started, false) as ready from concept.push_settings where id = 1;")
            if jq -e '.[0].ready == true' <<<"$status" >/dev/null; then
              echo "The hosted mobile notification scheduler completed a dispatch."
              exit 0
            fi
            sleep 5
          done
          echo "::error::The hosted notification scheduler did not complete a dispatch."
          exit 1
      - name: Remove the retired web setup secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.project.outputs.ref }}
        run: |
          supabase secrets unset ADMIN_SETUP_TOKEN --project-ref "$PROJECT_REF" ||
            echo "::warning::The web setup secret is unused and can be removed from the project’s Edge Function secrets."
